plugins {
    id 'com.android.application'
}
android {
    namespace 'org.revibe.installprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'org.revibe.installcheck2'
        minSdk 19
        targetSdk 35
        testInstrumentationRunner 'org.revibe.installprobe.InstallCallbackInstrumentation'
        versionCode 2
        versionName '0.3.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
