name: Revibe independent client foundation (NOT FUNCTIONAL MESSENGER)
on:
  push:
    paths:
      - 'Messenger/client/**'
      - '.github/workflows/revibe-client-foundation.yml'
  pull_request:
    paths:
      - 'Messenger/client/**'
      - '.github/workflows/revibe-client-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run actual foundation unit contracts
        run: python3 -m unittest discover -s Messenger/client/tests -v
      - name: Compile native Android foundation and instrumentation
        working-directory: Messenger/client
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify debug APK and non-release metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='Messenger/client/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/revibe-client-foundation-badging.txt
          grep -F "package: name='org.revibe.client.foundation'" /tmp/revibe-client-foundation-badging.txt
          grep -F "sdkVersion:'19'" /tmp/revibe-client-foundation-badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/revibe-client-foundation-badging.txt
          if unzip -Z1 "$APK" | grep -E '^lib/.*\.so$'; then
            echo 'Unexpected native dependency in ABI-independent foundation' >&2
            exit 1
          fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Revibe-Client-Foundation-NOT-FUNCTIONAL-MESSENGER
          path: Messenger/client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Revibe-Client-Foundation-Instrumentation
          path: Messenger/client/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  emulator-foundation:
    name: Foundation-only install/launch + fail-closed assertions API ${{ matrix.api }}
    needs: build-foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            arch: x86
            target: default
          - api: 21
            arch: x86
            target: default
          - api: 23
            arch: x86_64
            target: google_apis
          - api: 35
            arch: x86_64
            target: google_apis
          - api: '37.0'
            arch: x86_64
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Revibe-Client-Foundation-NOT-FUNCTIONAL-MESSENGER
          path: foundation
      - uses: actions/download-artifact@v4
        with:
          name: Revibe-Client-Foundation-Instrumentation
          path: instrumentation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify distinct app and denied Meta session in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          emulator-boot-timeout: 600
          script: bash Messenger/client/scripts/emulator_verify.sh
