name: Revibe independent API19+ installation probe

on:
  push:
    paths:
      - 'Messenger/install-probe/**'
      - '.github/workflows/revibe-install-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner Android SDK and install API 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Offline source/manifest regression tests
        run: python3 -m unittest discover -s Messenger/install-probe/tests -v
      - name: Build independently authored Android app
        working-directory: Messenger/install-probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature, zip alignment and Android SDK floor
        shell: bash
        run: |
          set -euo pipefail
          APK='Messenger/install-probe/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/revibe-install-probe-badging.txt
          grep -F "sdkVersion:'19'" /tmp/revibe-install-probe-badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/revibe-install-probe-badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Revibe-API19-Install-Check-NOT-MESSENGER
          path: Messenger/install-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-install-smoke:
    name: Install + launch on Android API ${{ matrix.api }}
    needs: build-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            arch: x86
            target: default
          - api: 21
            arch: x86
            target: default
          - api: 23
            arch: x86_64
            target: google_apis
          - api: 35
            arch: x86_64
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Revibe-API19-Install-Check-NOT-MESSENGER
          path: install-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator; install and launch independent APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install install-artifact/app-debug.apk
            adb shell am start -W -n org.revibe.installcheck/org.revibe.installprobe.MainActivity
            sleep 3
            adb shell ps | grep -F 'org.revibe.installcheck'
