name: Revibe independent API19+ installation probe

on:
  push:
    paths:
      - 'Messenger/install-probe/**'
      - '.github/workflows/revibe-install-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner Android SDK and install API 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Offline source/manifest regression tests
        run: python3 -m unittest discover -s Messenger/install-probe/tests -v
      - name: Build independently authored Android app
        working-directory: Messenger/install-probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature, zip alignment and Android SDK floor
        shell: bash
        run: |
          set -euo pipefail
          APK='Messenger/install-probe/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/revibe-install-probe-badging.txt
          grep -F "sdkVersion:'19'" /tmp/revibe-install-probe-badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/revibe-install-probe-badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Revibe-API19-Installation-Probe-NOT-MESSENGER
          path: Messenger/install-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
